services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinematic
      POSTGRES_USER: cinematic
      POSTGRES_PASSWORD: cinematic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinematic -d cinematic"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - cinematic_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://cinematic:cinematic@postgres:5432/cinematic
      AUTH_SECRET: local-development-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OPHIM_BASE_URL: https://ophim1.com
      OPHIM_IMAGE_BASE_URL: ""
    command:
      - sh
      - -c
      - npm install && npm run db:generate && npm run db:deploy && npm run dev -- --hostname 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cinematic_node_modules:/app/node_modules
      - cinematic_next_cache:/app/.next

volumes:
  cinematic_postgres_data:
  cinematic_node_modules:
  cinematic_next_cache:
